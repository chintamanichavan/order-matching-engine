[workspace]
members = ["crates/engine", "crates/api", "crates/risk"]
resolver = "2"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
crossbeam    = "0.8"
dashmap      = "6"
axum         = "0.7"
tracing      = "0.1"
anyhow       = "1"
uuid         = { version = "1", features = ["v4"] }
